<script>
'use strict';
// New Dawn: route coloured light with mirrors into crystals; mix red, green and blue.
// The one-shot's check hooks are kept: the fixed step, the clock hook, window.game and the
// play and figures scenes. Everything is drawn in code; nothing is loaded from the network.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.beamGlow is CONFIG.beamGlow.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
let W = 1280, H = 720;          // logical size; fit() sets it from the window (short side 440..760)
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const TITLE = 'New Dawn';
const TOUCH = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches); // phones and tablets: no keyboard hints
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: draws at pixel ratio 1
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
/** A separate seeded generator (same mulberry32), so a level is the same whatever else ran. */
function makeRng(s) {
  let a = s | 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), a | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

  const short = Math.min(iw, ih);

  const dpr = CHEAP ? 1 : Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(iw * dpr); canvas.height = Math.round(ih * dpr);
  canvas.style.width = iw + 'px'; canvas.style.height = ih + 'px';
  ctx.setTransform(VK * dpr, 0, 0, VK * dpr, 0, 0);
}

function text(s, x, y, size, c, align = 'center', weight = 600) {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
/** Splits s into lines no wider than maxW at the given size. */
function wrap(s, maxW, size, weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  const words = s.split(' '), lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }

function cleanSave(s) {
  const obj = v => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});

    const o = {};
    for (const [k, n] of Object.entries(obj(src))) { const v = Math.round(+n); if (keyOk(k) && v >= 1 && v <= 3) o[k] = v; }

  title: {

    draw(t) {

        { c: BLU, pts: [[(cx + ex) / k, cy / k], [cx / k, cy / k]], len: ex / k },

      drawCrystal(cx, cy, s * 1.2, WHT, WHT, 'lit', 0.9 + 0.1 * Math.sin(t * 2), t, 0);
      const fs = Math.min(76, W * 0.13, H * 0.1), ty = cy + s * 0.75 + fs * 0.85;
      ctx.save();

      const n = solvedCount(), daily = save.daily[todayKey()], L10 = T();
      const labels = [
        [n === 0 ? L10.play : n >= LEVELS.length ? L10.playOn : L10.cont(nextLevel() + 1), { primary: true, size: 21 }],
        [L10.levelsBtn(starCount(), LEVELS.length * 3), { icon: 'menu', iconLeft: true, size: 19, solid: true }],

      const gap = 12, by0 = sy + 32, avail = H - by0 - (ctrl.length * 21 + 30);

      } else { // two columns on short, wide screens

        labels.forEach(([lab, o], k2) => button(cx - bw - gap / 2 + (k2 % 2) * (bw + gap), by0 + Math.floor(k2 / 2) * (bh + gap), bw, bh, lab, () => { SFX.click(); TITLE_ACTS[k2](); }, { ...o, focus: ui.focus === k2 && !pointer.mouse }));
      }
      ctrl.forEach((l, k2) => text(l, cx, H - 22 - (ctrl.length - 1 - k2) * 21, 15, 'rgba(232,236,255,0.85)', 'center', 500));

  levels: {
    update(dt) {
      menuClock += dt;
      const n = LEVELS.length, cols = this.cols || 10;
      const move = dx => { ui.focus = clamp(ui.focus + dx, 0, n - 1); SFX.click(); };
      if (pressed('ArrowRight')) move(1); if (pressed('ArrowLeft')) move(-1);
      if (pressed('ArrowDown')) move(cols); if (pressed('ArrowUp')) move(-cols);

    },
    draw(t) {
      drawSky(t); ui.buttons = [];
      button(16, 14, 52, 52, '', () => { SFX.click(); goScene('title'); }, { icon: 'back' });
      text(T().pickLevel, W / 2, 40, 26, '#fff', 'center', 800);
      text(`${starCount()} / ${LEVELS.length * 3}`, W - 46, 40, 18, '#ffd98a', 'right', 700);
      starPath(W - 28, 40, 10); ctx.fillStyle = '#ffd98a'; ctx.fill();
      const land = W > H * 1.12, cols = land ? 10 : 5, rowsPer = 10 / cols;
      const top = 84, headH = 34, gapY = 12, gapX = 10;
      const tileW = Math.min(92, (W - 32 - gapX * (cols - 1)) / cols);
      const perRowH = (H - top - 20 - 3 * headH - 18) / (3 * rowsPer);
      const ts = Math.max(40, Math.min(tileW, perRowH - gapY - 4));
      this.cols = cols;
      const gw = cols * ts + (cols - 1) * gapX, gx = (W - gw) / 2;
      let y = top;
      CHAPTERS.forEach((ch, ci) => {
        const got = [...Array(10).keys()].reduce((s, k) => s + (save.stars[ci * 10 + k] || 0), 0);
        text(T().chapter(ci + 1, T().chapters[ci]), gx, y + headH / 2, 18, css(ch.accent), 'left', 700);
        text(`${got}/30`, gx + gw, y + headH / 2, 16, 'rgba(255,230,170,0.9)', 'right', 600);
        y += headH;

          const li = ci * 10 + k, x = gx + (k % cols) * (ts + gapX), yy = y + Math.floor(k / cols) * (ts + gapY + 4);

          const b = { x, y: yy, w: ts, h: ts, action: () => { if (open) { SFX.click(); startPuzzle('campaign', li); } else SFX.deny(); } };
          ui.buttons.push(b);

          ctx.fill();
          ctx.strokeStyle = foc ? 'rgba(255,255,255,0.95)' : cur ? `rgba(255,215,150,${0.6 + 0.4 * Math.sin(t * 4)})` : st ? css(ch.accent, 0.7) : 'rgba(255,255,255,0.16)';
          ctx.lineWidth = foc || cur ? 2.5 : 1.3; ctx.stroke();
          if (open) {

            smallStars(x + ts / 2, yy + ts * 0.76, Math.max(5, ts * 0.085), st);
          } else icon('lock', x + ts / 2, yy + ts / 2, ts * 0.4, 'rgba(220,225,255,0.45)');

    },
  },
  play: {
    update(dt) {
      const st = state; st.t += dt;
      if (pressed('Escape')) { toMenu(); return; }
      if (!st.won) {
        const lv = st.lv, c = st.cur;
        const mv = (dx, dy) => { st.showCursor = true; c.x = clamp(c.x + dx, 0, lv.w - 1); c.y = clamp(c.y + dy, 0, lv.h - 1); };
        if (pressed('ArrowLeft')) mv(-1, 0); if (pressed('ArrowRight')) mv(1, 0);
        if (pressed('ArrowUp')) mv(0, -1); if (pressed('ArrowDown')) mv(0, 1);
        if (pressed('Space') || pressed('Enter')) { st.showCursor = true; cycleCell(c.y * lv.w + c.x); }
        if (pressed('Backspace') || pressed('Delete') || pressed('KeyX')) cycleCell(c.y * lv.w + c.x, true);
        if (pressed('KeyZ') || pressed('KeyY') || pressed('KeyU')) undoMove(); // Y: the Z key on German keyboards
        if (pressed('KeyR')) restartBoard();
        if (pressed('KeyH')) useHint();
      } else {
        st.winT += dt;
        if (st.winT >= tune.winDelay) { st.resT = 0; goScene('results'); }
      }
      for (const c of st.sim.crys) { const tg = c.st === 'lit' ? 1 : 0; st.glow[c.i] += (tg - st.glow[c.i]) * Math.min(1, dt * 7); }
      st.invShake = Math.max(0, st.invShake - dt); st.tileShake.t = Math.max(0, st.tileShake.t - dt);
      st.hintFlash = Math.max(0, st.hintFlash - dt * 1.5);
      updateFx(dt);
    },
    tap(p) {
      const L = state.L; if (!L || state.won) return;
      const i = cellAt(L, p.x, p.y);
      if (i >= 0) { state.showCursor = false; state.cur = { x: i % state.lv.w, y: (i / state.lv.w) | 0 }; cycleCell(i, p.btn === 2); }
    },
    draw(t) {
      const st = state; drawSky(t); ui.buttons = [];
      const L = playLayout(); st.L = L;
      drawBoardBase(L);
      drawBeams(st.sim, L, t, st.won ? 1 : 0.95);
      drawTiles(L, t);
      if (st.won) { // a sweep of light across the board
        const f = clamp(st.winT / 0.9, 0, 1), x = L.bx - L.cs + (L.bw + L.cs * 2) * f;
        ctx.save(); rr(L.bx - 14, L.by - 14, L.bw + 28, L.bh + 28, 22); ctx.clip();
        const g = ctx.createLinearGradient(x - L.cs * 1.5, 0, x + L.cs * 1.5, 0);
        g.addColorStop(0, 'rgba(255,240,200,0)'); g.addColorStop(0.5, `rgba(255,240,200,${0.22 * (1 - f * 0.5)})`); g.addColorStop(1, 'rgba(255,240,200,0)');
        ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(L.bx - 14, L.by - 14, L.bw + 28, L.bh + 28); ctx.restore();
      }
      drawFx();

    },
  },
  results: {
    update(dt) {
      const st = state; st.t += dt; st.resT += dt; updateFx(dt);
      for (const c of st.sim.crys) st.glow[c.i] += (1 - st.glow[c.i]) * Math.min(1, dt * 7);
      while (st.sounded < st.stars && st.resT > 0.35 + st.sounded * 0.28) SFX.star(st.sounded++);
      if (pressed('KeyR')) { startPuzzle(st.mode, st.li); return; }
      if (pressed('Escape')) { toMenu(); return; }

    },
    draw(t) {
      const st = state;
      scenes.play.draw(t); ui.buttons = [];

      const py = Math.max(8, (H - ph) / 2) + (1 - ease(st.resT / 0.45)) * 40;

        ctx.save(); ctx.globalAlpha = rise; drawSunDisc(sx, sy, sr, t, 0.16); ctx.restore();
      }
      ctx.save(); ctx.globalAlpha = ease(st.resT / 0.3);
      ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 40;
      rr(px, py, pw, ph, 26);
      const pg = ctx.createLinearGradient(0, py, 0, py + ph); pg.addColorStop(0, 'rgba(34,30,78,0.96)'); pg.addColorStop(1, 'rgba(14,14,40,0.96)');
      ctx.fillStyle = pg; ctx.fill(); ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
      ctx.strokeStyle = 'rgba(255,214,170,0.45)'; ctx.lineWidth = 1.5; ctx.stroke();
      const L10 = T(), title = final ? L10.sunrise : st.mode === 'daily' ? L10.dailySolved : L10.solved;
      text(title, W / 2, py + 48, final ? 30 : 34, '#fff3dc', 'center', 800);
      for (let k = 0; k < 3; k++) { // stars pop in one by one
        const at = 0.35 + k * 0.28, f = clamp((st.resT - at) / 0.25, 0, 1), got = k < st.stars;
        const sx = W / 2 + (k - 1) * 66, sy = py + 112 - (k === 1 ? 10 : 0), r = 26 * (got ? 0.6 + 0.4 * ease(f) + 0.15 * Math.sin(f * Math.PI) : 1);
        starPath(sx, sy, r);
        if (got && f > 0) { const g = ctx.createLinearGradient(sx, sy - r, sx, sy + r); g.addColorStop(0, '#fff6c0'); g.addColorStop(1, '#ffad40'); ctx.fillStyle = g; ctx.fill(); ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(sx, sy, r * 2.2, YEL, 0.35 * f); ctx.restore(); }
        else { ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5; ctx.stroke(); }
      }
      const lv = st.lv;
      text(L10.stats(st.used, lv.par, st.hintsUsed), W / 2, py + 168, 18, '#e3e6ff', 'center', 600);

      if (st.mode === 'endless') msg = L10.endlessMsg(save.endless);
      if (final) msg = L10.finalMsg;
      text(msg, W / 2, py + 198, 17, '#ffd9a8', 'center', 600);
      if (final) text(L10.finalMore, W / 2, py + 224, 16, '#cfd4ff', 'center', 500);
      const bw = pw - 60, bx = px + 30; let by = py + ph - 140;
      const nextLabel = final || st.mode === 'daily' ? L10.toTitle : st.mode === 'endless' ? L10.nextPuzzle : L10.next;
      button(bx, by, bw, 54, nextLabel, RESULT_ACTS[0], { primary: true, size: 21, focus: ui.focus === 0 && !pointer.mouse });
      by += 66;
      const hw = (bw - 12) / 2;
      button(bx, by, hw, 48, L10.again, RESULT_ACTS[1], { size: 18, focus: ui.focus === 1 && !pointer.mouse });
      button(bx + hw + 12, by, hw, 48, st.mode === 'campaign' ? L10.levels : L10.menu, RESULT_ACTS[2], { size: 18, focus: ui.focus === 2 && !pointer.mouse });
      ctx.restore();
    },
  },
};
const RESULT_ACTS = [
  () => { SFX.click(); goNext(); },
  () => { SFX.click(); startPuzzle(state.mode, state.li); },
  () => { SFX.click(); toMenu(); },
];

function drawHud(L, t) {
  const st = state, lv = st.lv, L10 = T(), name = puzzleName(st), tip = puzzleTip(st);
  text(name, 18, 34, 28, '#ffffff', 'left', 800);
  text(puzzleSub(st), 18, 64, 16, 'rgba(220,226,255,0.85)', 'left', 600);
  // the mirror stock: one bar per mirror, bright while still free; packed tighter when the name needs the room
  const inv = st.inventory, free = Math.max(0, inv - st.used);
  const sh = st.invShake > 0 ? Math.sin(st.invShake * 50) * 6 : 0;
  ctx.font = `800 28px ${FONT}`; const nameR = 18 + ctx.measureText(name).width;
  const ix = W - 18 + sh, n = inv, iw = clamp((ix - nameR - 14) / Math.max(1, n), 8, 22);
  for (let k = 0; k < n; k++) icon('mirror', ix - (n - k - 0.5) * iw, 32, Math.min(22, iw + 6), k < free ? '#e8eeff' : 'rgba(232,238,255,0.22)');
  text(L10.stock(free, lv.par), ix, 64, 16, st.used > lv.par ? '#ffc39a' : 'rgba(220,226,255,0.85)', 'right', 600);
  if (tip && scene !== 'results') { // the tip for this level
    const tb = L.tipBox, bw = Math.min(tb.w, 640), lh = 21;
    const lines = wrap(tip, bw - 28, 17, 500).slice(0, tb.lines);
    const bh = lines.length * lh + 14, bx = tb.x + (tb.w - bw) / 2, byy = tb.y + (tb.h - bh) / 2;
    ctx.save(); ctx.globalAlpha = ease(st.t / 0.6);
    rr(bx, byy, bw, bh, 14); ctx.fillStyle = 'rgba(255,255,255,0.075)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,220,170,0.28)'; ctx.lineWidth = 1; ctx.stroke();
    lines.forEach((l, k) => text(l, bx + bw / 2, byy + 7 + lh / 2 + k * lh, 17, '#fff1dc', 'center', 500));
    ctx.restore();
  }
  const hintsLeft = Math.max(0, tune.maxHints - st.hintsUsed);
  const defs = [
    ['menu', L10.menu, () => { SFX.click(); toMenu(); }],
    ['undo', L10.undo, undoMove],
    ['reset', L10.reset, restartBoard],
    ['hint', L10.hint(hintsLeft), useHint],
    [muted ? 'mute' : 'sound', L10.sound, toggleMute],
  ];
  if (L.land) {
    const bw = 96, gap = 10, x = 18, bh = Math.min(70, Math.floor((H - 96 - 12 - gap * 4) / 5)), y0 = Math.max(96, (H - (bh * 5 + gap * 4)) / 2);
    defs.forEach(([ic, lab, act], k) => button(x, y0 + k * (bh + gap), bw, bh, lab, act, { icon: ic, r: 16, dim: (k === 1 && !st.undo.length) || (k === 3 && !hintsLeft) }));
  } else {
    const gap = 8, bw = Math.min(90, (W - 28 - gap * 4) / 5), bh = 74, total = bw * 5 + gap * 4, x0 = (W - total) / 2, y = H - bh - 22;
    defs.forEach(([ic, lab, act], k) => button(x0 + k * (bw + gap), y, bw, bh, lab, act, { icon: ic, r: 16, dim: (k === 1 && !st.undo.length) || (k === 3 && !hintsLeft) }));
  }
  if (st.hintFlash > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = st.hintFlash * 0.18; ctx.fillStyle = '#9ff'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  try {
    if (pressed('KeyM')) { toggleMute(); hit.delete('KeyM'); }
    if (pressed('KeyL') && (scene === 'title' || scene === 'levels')) toggleLang();
    for (const p of taps.splice(0)) {
      const sc = scene, st = state;
      const b = [...ui.buttons].reverse().find(bb => inRect(p, bb));
      if (b) b.action(); else if (scenes[scene].tap) scenes[scene].tap(p);
      if (scene !== sc || state !== st) break; // later taps were aimed at the old screen
    }
    scenes[scene].update(STEP);
    updateSky(STEP);
  } finally { hit.clear(); }
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { acc -= STEP; step(); }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() {
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  scenes[scene].draw((scene === 'play' || scene === 'results') && state ? state.t : menuClock);
}
function frame() { try { tick(); } finally { requestAnimationFrame(frame); } } // one error never stops the loop
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
  tap(x, y, btn = 0) { taps.push({ x, y, btn }); }, // logical coordinates, handled on the next step
  solve() { if (scene === 'play' && !state.won) { state.placed = new Int8Array(state.placed.length); for (const s of state.lv.sol) state.placed[s.i] = s.m; afterMove(); } }, // checks only
  simulate, generate, LEVELS, solvable,
};

seed = Number(params.get('seed')) || CONFIG.seed;
scene = params.get('scene') || 'title';
if (params.get('level')) startPuzzle('campaign', Number(params.get('level')) - 1);
else if (scene === 'play' || scene === 'results') startPuzzle('campaign', nextLevel());
if (params.get('scene') === 'figures') scene = 'figures';
if (!scenes[scene]) scene = 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
